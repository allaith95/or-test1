<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="أوركا للشحن" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; manifest-src 'self' blob: data:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https: ws: wss:; media-src 'self' data: blob:; worker-src 'self' blob:;" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>أوركا اكسبريس - منظومة الشحن البري والخدمات اللوجستية</title>
    <link rel="icon" type="image/jpeg" href="/orca_express_logo.jpg" />
    <link rel="apple-touch-icon" href="/orca_express_logo.jpg" />
    <script>
      (function() {
        try {
          var customIcon = localStorage.getItem('orca_custom_app_icon');
          var customName = localStorage.getItem('orca_custom_app_name');
          if (customIcon) {
            var icon = document.querySelector("link[rel='icon']");
            if (icon) icon.href = customIcon;
            var appleIcon = document.querySelector("link[rel='apple-touch-icon']");
            if (appleIcon) appleIcon.href = customIcon;
            if (customName) {
              var appleTitle = document.querySelector("meta[name='apple-mobile-web-app-title']");
              if (appleTitle) appleTitle.setAttribute('content', customName);
            }
          }
        } catch(e) {}
      })();
    </script>
    <meta name="description" content="منظومة سحابية متقدمة لإدارة فروع ومستودعات شركة أوركا للشحن البري والخدمات اللوجستية في الجمهورية العربية السورية مع إدارة الصناديق الثنائية (USD/SYP) ومصمم المنافيست." />
    <meta property="og:title" content="أوركا اكسبريس - منظومة اللوجستيات والشحن السريع" />
    <meta property="og:description" content="منظومة سحابية متقدمة لإدارة فروع ومستودعات شركة أوركا للشحن البري والخدمات اللوجستية في الجمهورية العربية السورية مع إدارة الصناديق الثنائية (USD/SYP) ومصمم المنافيست." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com">

  </head>
  <body class="bg-[#0b101b] text-slate-100 antialiased font-['Cairo',sans-serif] selection:bg-cyan-500/30 selection:text-cyan-200 overflow-x-hidden">

    <script type="module" src="./src/main.tsx"></script>
