version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orca_logistics_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=postgres://${POSTGRES_USER:-orca_admin}:${POSTGRES_PASSWORD:-SecurePassword2026!}@postgres:5432/${POSTGRES_DB:-orca_express_db}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - vps-data:/app/vps-data
    networks:
      - orca_network

  postgres:
    image: postgres:16-alpine
    container_name: orca_postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orca_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SecurePassword2026!}
      POSTGRES_DB: ${POSTGRES_DB:-orca_express_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orca_admin} -d ${POSTGRES_DB:-orca_express_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - orca_network

  nginx:
    image: nginx:alpine
    container_name: orca_nginx_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - webroot:/var/www/html
    depends_on:
      - app
    networks:
      - orca_network

networks:
  orca_network:
    driver: bridge

volumes:
  vps-data:
  postgres-data:
  certbot-etc:
  certbot-var:
  webroot:
