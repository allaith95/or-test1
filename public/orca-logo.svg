<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Rich Golden Gradient -->
    <linearGradient id="orcaGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD659" />
      <stop offset="50%" stop-color="#F5BA13" />
      <stop offset="100%" stop-color="#D49308" />
    </linearGradient>

    <!-- Cream White Dorsal Gradient -->
    <linearGradient id="orcaWhiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FAF7EE" />
      <stop offset="100%" stop-color="#F0E8D0" />
    </linearGradient>

    <!-- Golden Text Gradient -->
    <linearGradient id="orcaTextGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFDA66" />
      <stop offset="50%" stop-color="#F5BA13" />
      <stop offset="100%" stop-color="#E5A60A" />
    </linearGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Transparent or Neutral Canvas for universal application -->
  <g transform="translate(100, 50) scale(0.95)" filter="url(#subtleGlow)">
    <!-- 1. Upper Dorsal & Head Leaping Silhouette (Cream White / Ivory) -->
    <path
      d="M 175 225
         C 195 135, 290 65, 410 70
         C 515 75, 595 115, 620 165
         C 595 140, 545 130, 480 132
         C 360 136, 265 185, 220 240
         C 310 215, 435 222, 515 285
         C 565 320, 595 372, 610 435
         C 585 360, 530 305, 465 268
         C 395 230, 305 222, 240 245
         C 205 260, 175 245, 175 225 Z"
      fill="url(#orcaWhiteGrad)"
    />

    <!-- Upper Dorsal Eye Notch / Patch -->
    <path
      d="M 330 130
         C 355 125, 380 130, 395 142
         C 375 145, 355 140, 330 130 Z"
      fill="#1A1F2C"
      opacity="0.15"
    />

    <!-- 2. Main Dynamic Golden Yellow Body Loop & Tail Flukes -->
    <!-- Golden Upper Swoop Wave -->
    <path
      d="M 235 275
         C 265 200, 360 170, 450 182
         C 530 195, 575 265, 515 350
         C 460 430, 375 448, 330 500
         C 305 528, 325 548, 370 535
         C 445 515, 535 440, 565 375
         C 570 422, 540 495, 480 550
         C 395 625, 280 615, 250 535
         C 232 475, 280 410, 315 370
         C 340 340, 335 315, 290 315
         C 255 315, 235 295, 235 275 Z"
      fill="url(#orcaGoldGrad)"
    />

    <!-- Golden Tail Fluke Arc -->
    <path
      d="M 70 480
         C 135 460, 225 490, 290 532
         C 225 568, 160 618, 130 665
         C 170 665, 280 650, 380 618
         C 480 590, 560 550, 610 500
         C 535 572, 430 635, 300 662
         C 175 688, 80 652, 70 480 Z"
      fill="url(#orcaGoldGrad)"
    />

    <!-- Tail Highlight Accent -->
    <path
      d="M 290 532
         C 200 508, 115 520, 70 480
         C 118 555, 205 585, 290 532 Z"
      fill="#FFE082"
      opacity="0.9"
    />
  </g>

  <!-- 3. Official ORCA EXPRESS Typography -->
  <text
    x="400"
    y="735"
    text-anchor="middle"
    fill="url(#orcaTextGold)"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Montserrat', 'Arial Black', sans-serif"
    font-size="56"
    font-weight="900"
    letter-spacing="10"
  >ORCA EXPRESS</text>
</svg>
